version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: student_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: student_db
    ports:
      - "3306:3306"
    volumes:
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/mysql
    networks:
      - student_network

  backend:
    build: ./backend
    container_name: student_backend
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=student_db
      - JWT_SECRET=super_secret_jwt_key
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - student_network

  frontend:
    build: ./frontend
    container_name: student_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - student_network

networks:
  student_network:
    driver: bridge

volumes:
  db_data: